spring:
  application:
    name: fsm

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

jwt:
  secret: "V7qN2xK9mR4tY8pL6sW3cF1hJ5zD9bG7uA2eX6nP4vQ8"

file:
  upload-dir: C:/upload

app:
  base-url: https://docker-setup-demo.onrender.com
  contact:
    notification-email: ${CONTACT_NOTIFICATION_EMAIL:amrutharajan852@gmail.com}

whatsapp:
  graph-api-url: ${WHATSAPP_GRAPH_API_URL}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  access-token: ${WHATSAPP_ACCESS_TOKEN}
  template-name: ${WHATSAPP_TEMPLATE_NAME}
  template-language: ${WHATSAPP_TEMPLATE_LANGUAGE}
  template-yes-name: ${WHATSAPP_TEMPLATE_YES_NAME}
  template-no-name: ${WHATSAPP_TEMPLATE_NO_NAME}
  template-thankyou-service-update-name: ${WHATSAPP_TEMPLATE_THANKYOU_SERVICE_UPDATE_NAME}



  webhook:
    verify-token: ${WEBHOOK_VERIFY_TOKEN}
    app-secret: ${WHATSAPP_APP_SECRET}